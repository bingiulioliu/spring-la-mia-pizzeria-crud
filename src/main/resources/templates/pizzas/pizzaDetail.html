<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${pizza.name}">Dettaglio Pizza</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div th:replace="~{fragments/fragments :: navbar('pizzas')}"></div>

    <div class="container">
        <!-- Includo la card di dettaglio passando l'oggetto 'pizza' dal Controller -->

    </div>
</body>
</html>
