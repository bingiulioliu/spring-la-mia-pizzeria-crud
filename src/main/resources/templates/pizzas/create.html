<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Aggiungi Pizza</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h3 class="card-title mb-0">Aggiungi una nuova pizza</h3>
                    </div>
                    <div class="card-body p-4">

                        <form th:action="@{/pizzas/create}" th:object="${pizza]}" method="POST">

                            <!-- Campo name -->
                            <div class="mb-3">
                                <label for="title" class="form-label fw-bold">Nome</label>
                                <input type="text" 
                                    id="name" 
                                    class="form-control" 
                                    th:field="*{name}" 
                                    th:errorclass="is-invalid" 
                                    placeholder="Es. Pizza Margherita">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">
                                    Errore nome
                                </div>
                            </div>

                            <!-- Campo url -->
                            <div class="mb-3">
                                <label for="img" class="form-label fw-bold">URL immagine</label>
                                <input type="text" 
                                    id="img" 
                                    class="form-control" 
                                    th:field="*{img}" 
                                    th:errorclass="is-invalid" 
                                    placeholder="https://images.unsplash.com/photo-1604382354936-07c5d9983bd3">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('img')}" th:errors="*{img}">
                                    Errore url
                                </div>
                            </div>

                            <!-- Campo descrizione) -->
                            <div class="mb-3">
                                <label for="description" class="form-label fw-bold">Descrizione</label>
                                <input type="text" 
                                    id="description" 
                                    class="form-control" 
                                    th:field="*{description}" 
                                    th:errorclass="is-invalid" 
                                    placeholder="Es. pizza fruttata">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">
                                    Errore descrizione
                                </div>
                            </div>

                            <!-- Prezzo -->
                            <div class="mb-3">
                                <label for="price" class="form-label fw-bold">Prezzo</label>
                                <input type="text" 
                                    id="price" 
                                    class="form-control" 
                                    th:field="*{price}" 
                                    th:errorclass="is-invalid" 
                                    placeholder="Es. 9788845292690">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('price')}" th:errors="*{price}">
                                    Errore prezzo
                                </div>
                            </div>

                            <!-- Pulsanti di Azione -->
                            <div class="d-flex justify-content-between">
                                <a th:href="@{/pizzas}" class="btn btn-secondary">Annulla</a>
                                <button type="submit" class="btn btn-success">Salva pizza</button>
                            </div>

                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
